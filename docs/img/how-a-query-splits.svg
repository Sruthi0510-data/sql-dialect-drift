<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="title desc">
<title id="title">How one query splits six warehouses</title>
<desc id="desc">The same ORDER BY returns two different top-three lists across six warehouses because NULLs sort last on three of them and first on the other three. Adding NULLS LAST collapses the two answers into one.</desc>
<rect width="880" height="380" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1b" text-anchor="start">One ranking, two answers</text>
<text x="24.0" y="58.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="400" fill="#6b6b66" text-anchor="start">SELECT account FROM ledger ORDER BY balance_cents, account LIMIT 3</text>
<rect x="24" y="92" width="832" height="98" rx="8" fill="none" stroke="#d9d9d4" stroke-width="1.5"/>
<text x="44.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2a78d6" text-anchor="start">NULLs sort last</text>
<text x="44.0" y="144.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b6b66" text-anchor="start">postgres  redshift  snowflake</text>
<text x="44.0" y="170.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1d1d1b" text-anchor="start">acct-05, acct-12, acct-11</text>
<rect x="24" y="210" width="832" height="98" rx="8" fill="none" stroke="#d9d9d4" stroke-width="1.5"/>
<text x="44.0" y="238.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#eb6834" text-anchor="start">NULLs sort first</text>
<text x="44.0" y="262.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b6b66" text-anchor="start">bigquery  mysql  oracle</text>
<text x="44.0" y="288.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1d1d1b" text-anchor="start">acct-02, acct-03, acct-05</text>
<rect x="24" y="330" width="832" height="36" rx="8" fill="none" stroke="#1baf7a" stroke-width="1.5"/>
<text x="44.0" y="353.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#1baf7a" text-anchor="start">ORDER BY balance_cents NULLS LAST  ->  all six agree</text>
<text x="856.0" y="353.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6b66" text-anchor="end">2 answers becomes 1</text>
</svg>
